[metadata]
name = cleer
version = attr: cleer.__version__
description = Extensible and customizable file formatter with reading (me) friendly defaults.
long_description = file: README.md, CHANGELOG.md
long_description_content_type = text/markdown
author = Brandon Temple Paul
author_email = btemplepgit@gmail.com
url = https://github.com/btemplep/cleer
project_urls = 
    Repository = https://github.com/btemplep/cleer
classifiers = 
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Operating System :: POSIX :: Linux
    Operating System :: Unix
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Internet
license = MIT
license_files = 
    LICENSE
keywords = 
    format
    formatter
    file
    extend
    custom
    inspect
python_requires = >= 3.11

[options.packages.find]
where=src
exclude =
    tests

[options]
package_dir=
    =src
packages = find:
install_requires =
    loguru

[options.entry_points]
console_scripts =
    cleer = cleer.cli:main

[options.extras_require]
dev = 
    build
    coverage
    nox
    pytest
    pytest-cov
    twine
